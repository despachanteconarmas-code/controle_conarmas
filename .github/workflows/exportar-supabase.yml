name: Exportar Supabase gerenciado (migração)

# Roda SÓ manualmente (Actions > este workflow > Run workflow).
# Exporta banco (estrutura, dados e usuários) e arquivos do Supabase
# gerenciado, criptografa com a chave pública da VPS e envia o pacote para o
# Supabase self-hosted por um link de upload de uso único.
#
# O link é gerado na VPS com:  /opt/stacks/supabase/migracao/gerar-link.sh
# e vale 2 horas. Só a VPS tem a chave privada para abrir o pacote.
#
# Os logs mostram só totais: nenhum dado, nome de arquivo ou chave.
on:
  workflow_dispatch:
    inputs:
      upload_url:
        description: "Link de upload gerado na VPS (gerar-link.sh)"
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: exportar-supabase
  cancel-in-progress: false

env:
  SUPABASE_PROJECT_REF: utwujmzfwpyixczstdjw
  SUPABASE_DB_HOST: aws-1-sa-east-1.pooler.supabase.com

jobs:
  exportar:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Conferir o link
        env:
          UPLOAD_URL: ${{ inputs.upload_url }}
        run: |
          set -euo pipefail
          # Link copiado do chat pode vir com espaço, quebra de linha ou com o
          # hífen trocado por um "hífen tipográfico" (‐ ‑ ‒ – — −), que o
          # servidor rejeita. Normaliza e mostra o que ainda sobrar de estranho.
          LIMPO=$(printf '%s' "$UPLOAD_URL" | python3 -c '
          import sys
          s = sys.stdin.read()
          for c in "‐‑‒–—―−﹣－":
              s = s.replace(c, "-")
          s = "".join(ch for ch in s if not ch.isspace() and ch not in "­​‌‍﻿")
          estranhos = sorted({f"U+{ord(ch):04X}" for ch in s if ord(ch) > 127})
          if estranhos:
              print("Caracteres fora do padrão no link: " + ", ".join(estranhos), file=sys.stderr)
          print(s, end="")
          ')
          if [ "$LIMPO" != "$UPLOAD_URL" ]; then
            echo "Link normalizado (hífens tipográficos, espaços ou quebras de linha corrigidos)"
          fi
          if [ "$LIMPO" != "$UPLOAD_URL" ]; then
            echo "Removidos $(( ${#UPLOAD_URL} - ${#LIMPO} )) espaço(s)/quebra(s) de linha do link"
          fi
          TOKEN=${LIMPO#*token=}
          echo "::add-mask::$TOKEN"
          # Regex do próprio bash: com pipefail, "printf | grep -q" dava falso negativo
          # (o grep fecha a leitura ao achar o padrão e o printf leva SIGPIPE)
          PADRAO='^https://supabase\.armascon\.com\.br/storage/v1/object/upload/sign/migracao/pacote-[0-9]{8}-[0-9]{6}\.tar\?token=[A-Za-z0-9._-]+$'
          if ! [[ "$LIMPO" =~ $PADRAO ]]; then
            echo "::error::Link inválido (${#LIMPO} caracteres). Gere outro na VPS com gerar-link.sh e cole inteiro, sem cortes."
            exit 1
          fi
          echo "Link válido (${#LIMPO} caracteres)"
          echo "UPLOAD_URL_LIMPO=$LIMPO" >> "$GITHUB_ENV"

      - name: Checkout do código
        uses: actions/checkout@v4

      - name: Instalar Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: 2.114.0

      - name: Exportar o banco
        env:
          DB_URL: postgresql://postgres.${{ env.SUPABASE_PROJECT_REF }}:${{ secrets.SUPABASE_DB_PASSWORD }}@${{ env.SUPABASE_DB_HOST }}:5432/postgres
        run: |
          set -euo pipefail
          umask 077
          mkdir -p "$RUNNER_TEMP/out"
          cd "$RUNNER_TEMP/out"
          # Mesmo roteiro da documentação do Supabase para trocar de projeto
          supabase db dump --db-url "$DB_URL" --role-only -f roles.sql
          supabase db dump --db-url "$DB_URL" -f schema.sql
          supabase db dump --db-url "$DB_URL" --data-only --use-copy -f data.sql
          ls -l *.sql | awk '{print $5, $9}'

      - name: Exportar os arquivos do Storage
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          set -euo pipefail
          if [ -z "$SUPABASE_ACCESS_TOKEN" ]; then
            echo "::error::Falta o secret SUPABASE_ACCESS_TOKEN (Supabase > Account > Access Tokens)"
            exit 1
          fi
          # --reveal: a saída vai só para o jq, nunca para o log
          KEY=$(supabase projects api-keys --project-ref "$SUPABASE_PROJECT_REF" --reveal -o json \
            | jq -r '.[] | select(.name == "service_role") | .api_key')
          echo "::add-mask::$KEY"
          [ -n "$KEY" ] && [ "$KEY" != "null" ] || { echo "::error::Chave service_role não encontrada"; exit 1; }
          SUPABASE_URL="https://$SUPABASE_PROJECT_REF.supabase.co" SERVICE_KEY="$KEY" \
            node infra/supabase/exportar-storage.mjs "$RUNNER_TEMP/out"

      - name: Criptografar
        run: |
          set -euo pipefail
          umask 077
          cd "$RUNNER_TEMP"
          openssl rand -out chave.bin 32
          tar -czf - -C out . | openssl enc -aes-256-cbc -pbkdf2 -iter 200000 -salt -pass file:chave.bin -out dados.enc
          openssl pkeyutl -encrypt -pubin -inkey "$GITHUB_WORKSPACE/infra/supabase/migracao-chave-publica.pem" \
            -pkeyopt rsa_padding_mode:oaep -pkeyopt rsa_oaep_md:sha256 -in chave.bin -out chave.enc
          sha256sum dados.enc > dados.enc.sha256
          shred -u chave.bin
          rm -rf out
          tar -cf pacote.tar dados.enc chave.enc dados.enc.sha256
          ls -l pacote.tar | awk '{print "pacote:", $5, "bytes"}'

      - name: Enviar para a VPS
        run: |
          set -uo pipefail
          # HTTP/1.1 explícito (o mesmo caminho testado na VPS) e o motivo no
          # log se falhar: a resposta do servidor não tem dados nem o token
          CODE=$(curl -sS --http1.1 --retry 2 --retry-all-errors -X PUT -H "Content-Type: application/x-tar" \
            --data-binary @"$RUNNER_TEMP/pacote.tar" "$UPLOAD_URL_LIMPO" \
            -o "$RUNNER_TEMP/resposta.txt" -w "%{http_code}")
          echo "upload: HTTP $CODE"
          if [ "$CODE" != "200" ]; then
            echo "Resposta do servidor:"; head -c 500 "$RUNNER_TEMP/resposta.txt"; echo
            echo "::error::Envio recusado (HTTP $CODE)"
            exit 1
          fi
          rm -f "$RUNNER_TEMP"/pacote.tar "$RUNNER_TEMP"/dados.enc "$RUNNER_TEMP"/chave.enc "$RUNNER_TEMP"/resposta.txt
          echo "### Pacote enviado" >> "$GITHUB_STEP_SUMMARY"
          echo "Na VPS: \`/opt/stacks/supabase/migracao/abrir-pacote.sh\`" >> "$GITHUB_STEP_SUMMARY"
