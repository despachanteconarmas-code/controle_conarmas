name: Build e publica imagem no GHCR

# Toda alteração na main aplica as migrations pendentes e gera uma
# imagem nova. O deploy na VPS continua manual (ver STACK-GHCR.yml).
on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

# Evita que dois pushes simultâneos rodem migration ao mesmo tempo
concurrency:
  group: deploy-conarmas
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}
  SUPABASE_PROJECT_REF: utwujmzfwpyixczstdjw
  # O runner do GitHub é só IPv4 e o host direto (db.*.supabase.co)
  # resolve apenas em IPv6, por isso a conexão vai pelo pooler.
  SUPABASE_DB_HOST: aws-1-sa-east-1.pooler.supabase.com

jobs:
  # Roda antes do build: se a migration falhar, nenhuma imagem nova é
  # publicada, e a stack em produção continua batendo com o banco.
  migrate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout do código
        uses: actions/checkout@v4

      - name: Instalar Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Migrations pendentes (dry-run)
        env:
          # Se a senha for trocada por uma com caracteres especiais,
          # ela precisa entrar aqui codificada para URL
          DB_URL: postgresql://postgres.${{ env.SUPABASE_PROJECT_REF }}:${{ secrets.SUPABASE_DB_PASSWORD }}@${{ env.SUPABASE_DB_HOST }}:5432/postgres
        run: supabase db push --dry-run --db-url "$DB_URL"

      - name: Aplicar migrations
        env:
          DB_URL: postgresql://postgres.${{ env.SUPABASE_PROJECT_REF }}:${{ secrets.SUPABASE_DB_PASSWORD }}@${{ env.SUPABASE_DB_HOST }}:5432/postgres
        run: supabase db push --db-url "$DB_URL"

  build-and-push:
    runs-on: ubuntu-latest
    needs: migrate

    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout do código
        uses: actions/checkout@v4

      - name: Configurar Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login no GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Gerar tags e labels da imagem
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          # latest  -> sempre o último build da main (usado pela stack)
          # sha-xxx -> build específico, para rollback
          # vX.Y.Z  -> quando existir uma tag git de versão
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,format=short
            type=ref,event=tag

      - name: Build e push da imagem
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # As VITE_* são embutidas no bundle em tempo de build
          build-args: |
            VITE_SUPABASE_URL=${{ vars.VITE_SUPABASE_URL }}
            VITE_SUPABASE_ANON_KEY=${{ secrets.VITE_SUPABASE_ANON_KEY }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Resumo do build
        run: |
          echo "### Imagem publicada" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          echo "${{ steps.meta.outputs.tags }}" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          echo "Para publicar na VPS:" >> $GITHUB_STEP_SUMMARY
          echo '```bash' >> $GITHUB_STEP_SUMMARY
          echo "docker service update --image ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest --force controle_conarmas_conarmas" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
